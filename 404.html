<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · Page not found · IP Inspector</title>
  <meta name="description" content="The page you're looking for doesn't exist. Head back to IP Inspector to look up any IP address or domain.">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#0c1218">

  <!-- Absolute paths: this page is served for any missing URL, at any depth -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/big-shoulders-latin-wght.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/newsreader-latin-wght.woff2" crossorigin>
  <link rel="stylesheet" href="/site.css">
  <script src="/404.js" defer></script>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <main class="nf wrap">
    <p class="display nf-code" aria-hidden="true">404</p>
    <h1 class="display">This IP trail went cold</h1>
    <p class="nf-lead">The page you're looking for doesn't exist, but you can still look one up below.</p>

    <form class="lookup-form" id="jumpForm">
      <label for="jumpInput">IP address or domain</label>
      <div class="ip-input-wrapper">
        <input type="text" id="jumpInput" placeholder="e.g., 8.8.8.8 or example.com" autocomplete="off" spellcheck="false">
        <button type="submit">Inspect</button>
      </div>
    </form>

    <ul class="nf-links">
      <li><a class="link" href="/">Back to IP Inspector</a></li>
      <li class="try">Try</li>
      <li><a class="link" href="/?ip=8.8.8.8">8.8.8.8</a></li>
      <li><a class="link" href="/?ip=1.1.1.1">1.1.1.1</a></li>
      <li><a class="link" href="/?ip=example.com">example.com</a></li>
    </ul>

    <p class="nf-foot">ip.hbenali.ovh, network intelligence. <a class="link" href="https://hbenali.ovh" target="_blank" rel="noopener noreferrer">hbenali.ovh<span class="sr-only"> (opens in a new tab)</span></a></p>
  </main>
</body>
</html>
